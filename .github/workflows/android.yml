name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check unused string resources
        run: python3 tools/check_unused_string_resources.py
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare for build
        run: |
          chmod +x gradlew
          echo "MAPS_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" > local.properties
      - name: Run unit tests (all modules)
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 7

  build:
    name: Assemble release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare for build
        run: |
          chmod +x gradlew
          echo "MAPS_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" > local.properties
      - name: Run debug lint
        run: ./gradlew lintDebug --no-daemon --stacktrace --console=plain
      - name: Run release lint
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace --console=plain
      - name: Build minified release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain
      - name: Build diagnostic release (nominify)
        run: ./gradlew :app:assembleRelease_nominify --no-daemon --stacktrace --console=plain
      - name: Check Room schema drift
        run: ./gradlew checkRoomSchemaDrift --no-daemon --stacktrace --console=plain
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          retention-days: 7
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-outputs
          path: |
            app/build/outputs/**
            */build/outputs/**
          retention-days: 7
