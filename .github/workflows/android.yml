name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check unused string resources
        run: python3 tools/check_unused_string_resources.py

  locale_hygiene:
    name: Locale hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate completed locale resources
        run: |
          for qualifier in \
            values-bg-rBG \
            values-hr-rHR \
            values-cs-rCZ \
            values-da-rDK \
            values-nl-rNL \
            values-et-rEE \
            values-fi-rFI \
            values-fr-rFR \
            values-de-rDE \
            values-el-rGR \
            values-ga-rIE \
            values-hu-rHU \
            values-it-rIT \
            values-lv-rLV \
            values-lt-rLT \
            values-mt-rMT \
            values-pl-rPL \
            values-pt-rPT \
            values-ro-rRO \
            values-sk-rSK \
            values-sl-rSI \
            values-es-rES \
            values-sv-rSE \
            values-ja-rJP \
            values-zh-rCN \
            values-zh-rTW \
            values-hi-rIN
          do
            python3 tools/validate_locale_resources.py "$qualifier"
          done

  quality_gates:
    name: Repository quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare for build
        run: |
          chmod +x gradlew
          echo "MAPS_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" > local.properties
      - name: Verify Tracebox package access
        run: |
          set -o pipefail
          report="$(mktemp)"
          ./gradlew :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency io.github.tracebox:tracebox \
            --refresh-dependencies \
            --no-daemon --stacktrace --console=plain 2>&1 | tee "$report"
          if grep -Eq '^io\.github\.tracebox:[^ ]+:[^ ]+ FAILED$' "$report"; then
            echo "Tracebox artifacts did not resolve from GitHub Packages." >&2
            exit 1
          fi
          if ! grep -Eq '^io\.github\.tracebox:tracebox:[^ ]+' "$report"; then
            echo "Tracebox dependency evidence was absent from dependencyInsight." >&2
            exit 1
          fi
      - name: Run repository quality gates
        id: quality_gates
        run: ./gradlew ciCheck --continue --no-daemon --stacktrace --console=plain
      - name: Verify unit-test report classes
        if: ${{ !cancelled() && steps.quality_gates.outcome == 'success' }}
        run: |
          build_logic_report="$(find build-logic/convention/build/test-results/test -type f -name '*.xml' -size +0c -print -quit)"
          if [ -z "$build_logic_report" ]; then
            echo "Build-logic tests completed without producing a non-empty XML test report." >&2
            exit 1
          fi
          echo "Found build-logic test evidence at $build_logic_report"
          for suite in testDebugUnitTest jvmTest testAndroidHostTest
          do
            report="$(find . -type f -path "*/build/test-results/$suite/*.xml" -size +0c -print -quit)"
            if [ -z "$report" ]; then
              echo "$suite completed without producing a non-empty XML test report." >&2
              exit 1
            fi
            echo "Found $suite evidence at $report"
          done
      - name: Upload quality-gate reports
        if: ${{ always() && steps.quality_gates.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-*/**
            **/build/reports/lint-results-*.*
            build/reports/detekt/**
          if-no-files-found: error
          retention-days: 7

  build_validation:
    name: Build release outputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: ''
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare for build
        run: |
          chmod +x gradlew
          echo "MAPS_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" > local.properties
      - name: Build minified release
        id: minified_release
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain
      - name: Verify minified release APK
        if: ${{ !cancelled() && steps.minified_release.outcome == 'success' }}
        run: |
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c -print -quit)"
          if [ -z "$apk" ]; then
            echo "assembleRelease completed without producing a non-empty APK." >&2
            exit 1
          fi
          echo "Found minified release APK at $apk"
      - name: Build diagnostic release (nominify)
        id: diagnostic_release
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleRelease_nominify --no-daemon --stacktrace --console=plain
      - name: Verify diagnostic release APK
        if: ${{ !cancelled() && steps.diagnostic_release.outcome == 'success' }}
        run: |
          apk="$(find app/build/outputs/apk/release_nominify -type f -name '*.apk' -size +0c -print -quit)"
          if [ -z "$apk" ]; then
            echo "assembleRelease_nominify completed without producing a non-empty APK." >&2
            exit 1
          fi
          echo "Found diagnostic release APK at $apk"
      - name: Upload APKs
        if: ${{ always() && (steps.minified_release.outcome != 'skipped' || steps.diagnostic_release.outcome != 'skipped') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-outputs
          path: |
            app/build/outputs/**
            */build/outputs/**
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - source_hygiene
      - locale_hygiene
      - quality_gates
      - build_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all CI evidence
        env:
          SOURCE_HYGIENE_RESULT: ${{ needs.source_hygiene.result }}
          LOCALE_HYGIENE_RESULT: ${{ needs.locale_hygiene.result }}
          QUALITY_GATES_RESULT: ${{ needs.quality_gates.result }}
          BUILD_VALIDATION_RESULT: ${{ needs.build_validation.result }}
        run: |
          failed=0
          for check in \
            "source_hygiene=$SOURCE_HYGIENE_RESULT" \
            "locale_hygiene=$LOCALE_HYGIENE_RESULT" \
            "quality_gates=$QUALITY_GATES_RESULT" \
            "build_validation=$BUILD_VALIDATION_RESULT"
          do
            name="${check%%=*}"
            result="${check#*=}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
