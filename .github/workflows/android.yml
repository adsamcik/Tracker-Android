name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses --channel=3 > /dev/null
          set -o pipefail
          sdkmanager --channel=3 --install \
            "platforms;android-37" \
            "build-tools;37.0.0-rc2" \
            "platform-tools"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare for build
        run: |
          chmod +x gradlew
          echo "MAPS_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" > local.properties
          cp -f google-services.json.example app/google-services.json
      - name: Run unit tests (all modules)
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 7

  build:
    name: Assemble release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses --channel=3 > /dev/null
          set -o pipefail
          sdkmanager --channel=3 --install \
            "platforms;android-37" \
            "build-tools;37.0.0-rc2" \
            "platform-tools"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare for build
        run: |
          chmod +x gradlew
          echo "MAPS_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" > local.properties
          cp -f google-services.json.example app/google-services.json
      - name: Run debug lint
        run: ./gradlew lintDebug --no-daemon --stacktrace --console=plain
      - name: Run release lint
        run: ./gradlew :app:lintRelease :app:checkReleaseLintReport --no-daemon --stacktrace --console=plain
      - name: Build minified release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain
      - name: Build diagnostic release (nominify)
        run: ./gradlew assembleRelease_nominify --no-daemon --stacktrace --console=plain
      - name: Check Room schema drift
        run: ./gradlew checkRoomSchemaDrift --no-daemon --stacktrace --console=plain
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          retention-days: 7
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-outputs
          path: |
            app/build/outputs/**
            */build/outputs/**
          retention-days: 7
