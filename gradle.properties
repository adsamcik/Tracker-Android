# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx8192m
android.useAndroidX=true
android.enableJetifier=false
android.debug.obsoleteApi=true
android.nonTransitiveRClass=true
## Windows workaround: keep KSP incremental processing disabled to avoid intermittent file-lock failures during generated source updates.
ksp.incremental=false
## Windows workaround: keep Kotlin incremental compilation disabled because incremental classpath snapshots can leave locked files behind.
kotlin.incremental=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false
## Built-in Kotlin (AGP 9): KSP still registers its generated sources via the kotlin.sourceSets DSL,
## which built-in Kotlin rejects by default. Allow it until KSP wires generated sources through the
## AGP variant API. See https://developer.android.com/build/migrate-to-built-in-kotlin
android.disallowKotlinSourceSets=false
## AGP 9 new DSL is kept disabled because the (unmaintained) oss-licenses-plugin still calls the
## removed applicationVariants API. Built-in Kotlin is enabled (flag removed); the KMP modules use
## com.android.kotlin.multiplatform.library so they no longer require the legacy DSL.
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
