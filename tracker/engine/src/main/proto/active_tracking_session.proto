syntax = "proto3";

package com.adsamcik.tracker.tracker.resilience;

option java_package = "com.adsamcik.tracker.tracker.resilience";
option java_multiple_files = true;

message CatalogReconfigurationSourcePlanProto {
  uint32 source_stable_code = 1;
  uint32 payload_version = 2;
  string payload_base64 = 3;
  string payload_checksum = 4;
}

message CatalogReconfigurationDebtProto {
  string logical_tracking_id = 1;
  string service_run_id = 2;
  uint64 source_policy_revision = 3;
  string requested_plan_id = 4;
  int64 requested_plan_created_at_ms = 5;
  repeated CatalogReconfigurationSourcePlanProto requested_plans = 6;
  uint64 deferred_source_mask = 7;
  string clock_domain_id = 8;
  string zone_id = 9;
  uint64 foreground_capability_flags = 10;
  uint64 control_dependency_mask = 11;
  uint64 requested_plan_revision = 12;
  string desired_plan_fingerprint = 13;
  uint64 desired_plan_generation = 14;
}

message SourcePlanIdentityProto {
  uint32 version = 1;
  uint64 generation = 2;
  string inputs_fingerprint = 3;
  string plan_fingerprint = 4;
}

message ActiveTrackingSessionProto {
  bool active = 1;
  bool user_initiated = 2;
  bool ambient = 3;
  string policy_tier = 4;
  // Correlates Android service replacement without turning a derived Room session into the
  // owner of tracking lifetime.
  string logical_tracking_id = 5;
  string service_run_id = 6;
  string lifecycle_state = 7;
  uint64 lifecycle_revision = 8;
  // Zero represents an unknown/legacy timestamp rather than the Unix epoch.
  int64 lifecycle_changed_at_epoch_ms = 9;
  string stop_candidate_reason = 10;
  int64 stop_candidate_requested_at_epoch_ms = 11;
  string restart_boot_id = 12;
  string restart_token = 13;
  // Exact derived aggregate row used only for safe process-death continuity. Zero means unknown.
  int64 session_segment_id = 14;
  // Opaque engine-issued reference to the exact accepted source-caller authority.
  string source_caller_authority_reference = 15;
  // Exact predecessor retained as durable cleanup debt until Room retirement succeeds.
  string pending_retirement_source_caller_authority_reference = 16;
  // Bounded exact catalog transition debt, scoped to this logical session and service run.
  CatalogReconfigurationDebtProto catalog_reconfiguration_debt = 17;
  // Exact effective runtime plan and independently sampled desired plan.
  SourcePlanIdentityProto applied_source_plan_identity = 18;
  SourcePlanIdentityProto desired_source_plan_identity = 19;
}
