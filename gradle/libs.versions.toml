[versions]
# Kotlin / KSP / AGP
kotlin = "2.4.10"
ksp = "2.3.10"
agp = "9.3.1"
tracebox = "0.1.0-alpha.3"

# Tools
benmanes = "0.57.0"
detekt = "2.0.0-alpha.6"
ossLicenses = "0.13.0"
desugarJdkLibs = "2.1.5"

# AndroidX / Google
coreKtx = "1.19.0"
coreLocationAltitude = "1.0.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintLayout = "2.2.2"
recyclerView = "1.4.0"
preference = "1.2.1"
lifecycle = "2.11.0"
work = "2.11.2"
paging = "3.5.0"
activityCompose = "1.13.0"
splashScreen = "1.2.0"
navigationCompose = "2.9.8"
constraintLayoutCompose = "1.1.2"
composeBom = "2026.06.01"
accompanist = "0.37.3"
documentfile = "1.1.0"
datastore = "1.2.1"
protobuf = "4.35.1"
protobufPlugin = "0.10.0"
sqliteJdbc = "3.53.2.1"
sqliteAndroidx = "2.7.0"
gson = "2.14.0"
glance = "1.1.1"
haze = "1.7.2"
startupRuntime = "1.2.0"
hilt = "2.60.1"
hiltAndroidx = "1.4.0"

# Google Play Services
playServicesBase = "18.10.0"
playLocation = "21.4.0"

# MapLibre
maplibreCompose = "0.13.1"
# MapLibre Android native SDK version bundled by maplibreCompose above. Used only to pull the
# OpenGL build of the native SDK (android-sdk-opengl) in place of the default Vulkan build. This
# MUST stay in sync with the android-sdk version that the maplibreCompose release depends on.
maplibreAndroid = "13.4.1"

# KotlinX
coroutines = "1.11.0"
kotlinxImmutable = "0.5.1"

# Arrow & Molecule
arrow = "2.2.3"

# JSON / DB
moshi = "1.15.2"
room = "2.8.4"

# Third party
componentsRecycler = "1.0.0"
componentSlider = "2.1.0"
spotlight = "2.2.3"
suncalc = "3.11"
javaxInject = "1"
licensesdialog = "2.2.0"
simplify = "1.0.0"
cardview = "1.0.0"

# HTTP client — routed exclusively through :network NetworkGateway.
# ArchitecturalFitnessTest prevents production modules outside :core:network from
# constructing clients; approved library adapters receive its shared Call.Factory.
okhttp = "5.4.0"

# Testing - JUnit 5 (Modern) & JUnit 4 (Android instrumented tests)
junit5 = "5.14.4"
junit4 = "4.13.2"
androidxTestRunner = "1.7.0"
uiautomator = "2.4.0"
androidxTestExtJunit = "1.3.0"
archCoreTesting = "2.2.0"
espresso = "3.7.0"

# Test libs (added)
robolectric = "4.16.1"
mockitoAndroid = "5.23.0"
mockitoKotlin = "6.3.0"
mockk = "1.14.11"
turbine = "1.2.1"
androidxTestCore = "1.7.0"
androidxTestRules = "1.7.0"
kotest = "6.2.3"

[libraries]
# Gradle plugin artifacts for convention plugins
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
protobuf-gradlePlugin = { group = "com.google.protobuf", name = "protobuf-gradle-plugin", version.ref = "protobufPlugin" }

# Arrow
arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow" }
tracebox = { group = "io.github.tracebox", name = "tracebox", version.ref = "tracebox" }
tracebox-native = { group = "io.github.tracebox", name = "tracebox-native", version.ref = "tracebox" }
tracebox-ui-compose = { group = "io.github.tracebox", name = "tracebox-ui-compose", version.ref = "tracebox" }

# Test libraries - JUnit 5 (for unit tests)
junit5-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit5-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit5-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
junit5-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
junit5-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit5" }
junit5-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

# Test libraries - JUnit 4 (for Android instrumented tests)
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockito-android = { module = "org.mockito:mockito-android", version.ref = "mockitoAndroid" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Kotest assertions (modern expressive assertions)
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
# Kotlin
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# UI Effects
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-location-altitude = { group = "androidx.core", name = "core-location-altitude", version.ref = "coreLocationAltitude" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerView" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# Paging
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# Google Material
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Play Services (location + base only; Maps removed)
google-play-services-base = { group = "com.google.android.gms", name = "play-services-base", version.ref = "playServicesBase" }
google-play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playLocation" }

# MapLibre
maplibre-compose = { group = "org.maplibre.compose", name = "maplibre-compose", version.ref = "maplibreCompose" }
# OpenGL build of the MapLibre Android native SDK. Swapped in for the default Vulkan build
# (org.maplibre.gl:android-sdk) because the Vulkan renderer segfaults on software-emulated GPUs
# (Android emulators) and the renderer backend is fixed per native-SDK build (not runtime-toggleable).
maplibre-android-opengl = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibreAndroid" }

# Moshi
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

# Room / SQLite
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
