licensesdialog = { group = "de.psdev.licensesdialog", name = "licensesdialog", version.ref = "licensesdialog" }
simplify = { group = "com.goebl", name = "simplify", version.ref = "simplify" }

# HTTP — client construction is owned by :core:network and enforced by ArchitecturalFitnessTest.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
