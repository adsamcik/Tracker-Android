gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Recycler & UI utils
components-recycler = { group = "com.github.adsamcik", name = "Recycler", version.ref = "componentsRecycler" }
component-slider = { group = "com.github.adsamcik", name = "slider", version.ref = "componentSlider" }

# Intro & SunCalc
spotlight = { group = "com.github.adsamcik", name = "spotlight", version.ref = "spotlight" }
suncalc = { group = "org.shredzone.commons", name = "commons-suncalc", version.ref = "suncalc" }
# Compose
