syntax = "proto3";

package com.adsamcik.tracker.shared.preferences.tracking;

option java_package = "com.adsamcik.tracker.shared.preferences.tracking";
option java_multiple_files = true;

// Proto for tracking parameter settings.
// Controls which data sources are active and how aggressively tracking operates.
// Extend with new optional fields; never reuse field numbers.
message TrackingParamsProto {
  // Data source toggles
  bool location_enabled = 1;
  bool activity_enabled = 2;
  bool steps_enabled = 3;
  bool wifi_enabled = 4;
  bool cell_enabled = 5;
  // Legacy Wi-Fi output toggles retained only so existing files can be folded into wifi_enabled.
  // New code must not write these fields.
  bool wifi_network_enabled = 6 [deprecated = true];
  bool wifi_location_count_enabled = 7 [deprecated = true];

  // Auto-tracking
  int32 auto_tracking_mode = 8;  // 0 = off, 1+ = enabled modes
  bool transition_detection_enabled = 9;

  // Notification
  bool notification_styled = 10;

  // Tracking parameters
  int32 min_distance_meters = 11;
  int32 min_time_seconds = 12;
  int32 required_accuracy_meters = 13;

  // Current preset name (HIGH_ACCURACY, BALANCED, POWER_SAVE, CUSTOM)
  string preset_name = 14;

  // Ski detection
  // Legacy detector toggles. Detection is now passive and automatically requirement-gated.
  bool ski_detection_enabled = 15 [deprecated = true];

  // Removed with the deferred vehicle-compliance feature. Never reuse its wire identity.
  reserved 16;
  reserved "vehicle_speed_limit_baseline_mps";

  // Sailing/boating detection (GPS speed + step rate based; see SailingDetectionConfig).
  bool sailing_detection_enabled = 17 [deprecated = true];

  // Plane/flight detection (barometric altitude + step rate based; see PlaneDetectionConfig).
  bool plane_detection_enabled = 18 [deprecated = true];

  // Raw pressure capture. Optional preserves the historical default (enabled) for files written
  // before this field existed while still allowing users to explicitly disable it.
  optional bool barometer_enabled = 19;

  // Versioned semantic per-source controls. Values use SourceCollectionFrequency stable codes:
  // 0 = OFF, 1 = BATTERY_SAVER, 2 = BALANCED, 3 = RESPONSIVE.
  optional int32 location_frequency = 20;
  optional int32 activity_frequency = 21;
  optional int32 steps_frequency = 22;
  optional int32 pressure_frequency = 23;
  optional int32 wifi_frequency = 24;
  optional int32 cell_frequency = 25;
  bool advanced_source_controls_enabled = 26;
  int32 source_settings_version = 27;

  // Internal migration marker so legacy Preferences import runs only once.
  bool legacy_migrated = 1000;
}
